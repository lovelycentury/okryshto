<style>
  /* Sidebar tree: indigo for hover + selected; black label when selected. */
  .sidebar-item:hover {
    background: color-mix(in srgb, #818cf8 35%, transparent) !important;
  }
  .sidebar-item:hover:not([data-selected="true"]) {
    color: #f5f5f7 !important;
  }
  .sidebar-item:hover:not([data-selected="true"]) * {
    color: inherit !important;
  }

  .sidebar-item[data-selected="true"],
  .sidebar-item[data-selected="true"]:hover {
    background: #818cf8 !important; /* --okkly-accent-secondary (indigo) */
    color: #000000 !important;
  }
  .sidebar-item[data-selected="true"] *,
  .sidebar-item[data-selected="true"]:hover * {
    color: #000000 !important;
  }
</style>
