name: Release

on:
  push:
    branches: [main]

# Never run two release jobs at once — they fight over the "Version Packages" PR.
concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action pushes the version-bump commit + git tags
      pull-requests: write # changesets/action opens/updates the "Version Packages" PR
      id-token: write # npm provenance (--provenance)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # npm 11.5.1+ ships the newer provenance/publish plumbing pnpm shells out to.
      - run: npm install -g npm@11

      - name: Create "Version Packages" PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
